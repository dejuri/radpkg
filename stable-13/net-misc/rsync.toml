[package]
name = "rsync"
version = "3.4.1"
description = "Fast versatile file-copying tool"
source = "https://www.samba.org/ftp/rsync/src/rsync-3.4.1.tar.gz"
sha256 = "2924bcb3a1ed8b551fc101f740b9f0fe0a202b115027647cf69850d65fd88c52"

[build]
system = "manual"
build_commands = [
	"./configure --prefix=/usr --disable-xxhash",
	"make -j$RAD_CORES"
]
install_command = [
	"make install DESTDIR=$DESTDIR"
]
depends = "zlib"
