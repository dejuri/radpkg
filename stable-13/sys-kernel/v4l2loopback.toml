[package]
name = "v4l2loopback"
version = "0.15.4"
description = "v4l2loopback - a kernel module to create virtual video devices"
source = "https://github.com/v4l2loopback/v4l2loopback/archive/refs/tags/v0.15.4.tar.gz"

[build]
system = "manual"
depends = "linux"
build_commands = [
	"make -j$RAD_CORES -C /lib/modules/{sys-kernel/linux.version}/build M=$PWD modules"
]
install_commands = [
	"make install KERNELRELEASE={sys-kernel/linux.version} DESTDIR=$DESTDIR INSTALL_MOD_PATH=$DESTDIR",
	"mkdir -p $DESTDIR/etc/modprobe.d $DESTDIR/etc/modules-load.d",
	"echo 'options v4l2loopback devices=1 video_nr=10 card_label=\"OBS Virtual Camera\" exclusive_caps=1' > $DESTDIR/etc/modprobe.d/v4l2loopback.conf",
	"echo 'v4l2loopback' > $DESTDIR/etc/modules-load.d/v4l2loopback.conf"
]
post_install = "depmod -a {sys-kernel/linux.version}"
