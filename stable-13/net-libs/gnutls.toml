[package]
name = "gnutls"
version = "3.8.13"
description = "The GnuTLS package contains libraries and userspace tools which provide a secure layer over a reliable transport layer"
source = "https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.13.tar.xz"
sha256 = "ffed8ec1bf09c2426d4f14aae377de4753b53e537d685e604e99a8b16ca9c97e"

[build]
system = "manual"
depends = "nettle,make-ca,libunistring,libtasn1,p11-kit"
build_commands = [
	"./configure --prefix=$PREFIX --docdir=$PREFIX/share/doc/gnutls-{version} --with-default-trust-store-pkcs11=\"pkcs11:\" --disable-static",
	"make -j$RAD_CORES"
]
install_command = "DESTDIR=$DESTDIR make install"
