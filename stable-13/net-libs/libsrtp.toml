[package]
name = "libsrtp"
version = "2.8.0"
description = "The libsrtp package provides functions for Secure Realtime Transport Protocol, or SRTP"
source = "https://github.com/cisco/libsrtp/archive/v2.8.0/libsrtp-2.8.0.tar.gz"
sha256 = "d123dcff5c56d4f1a9006f2b311ea99a85016cbf3bb24b1007885d422237db85"

[build]
system = "meson"
depends = [
	"nspr",
	"nss"
]
configure_args = [
	"-Dcrypto-library=nss",
	"-Dcrypto-library-kdf=disabled"
]
