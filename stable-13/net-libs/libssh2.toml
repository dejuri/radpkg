[package]
name = "libssh2"
version = "1.11.1"
description = "Libssh2 package is a client-side C library implementing the SSH2 protocol"
source = "https://www.libssh2.org/download/libssh2-1.11.1.tar.gz"
sha256 = "d9ec76cbe34db98eec3539fe2c899d26b0c837cb3eb466a56b0f109cabf658f7"

[build]
system = "manual"
build_commands = [
	"wget https://www.linuxfromscratch.org/patches/blfs/13.1/libssh2-1.11.1-security_fixes-1.patch",
	"patch -Np1 -i ./libssh2-1.11.1-security_fixes-1.patch",
	"./configure --prefix=$PREFIX --disable-docker-tests --disable-static",
	"make -j$RAD_CORES"
]
install_command = "make DESTDIR=$DESTDIR install"
