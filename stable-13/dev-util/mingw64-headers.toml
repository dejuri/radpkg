[package]
name = "mingw64-headers"
version = "14.0.0"
description = "MinGW-w64 headers for Windows"
source = "https://sourceforge.net/projects/mingw-w64/files/mingw-w64/mingw-w64-release/mingw-w64-v14.0.0.tar.bz2"
sha256 = "6eaf921d9eb987d3820b364ea9775bc19b965ec81490b6fdd716526c28e1995c"

[build]
system = "manual"
build_commands = "sh -c 'cd mingw-w64-headers; ./configure --prefix=$PREFIX/x86_64-w64-mingw32 --host=x86_64-w64-mingw32; make -j$RAD_CORES'"
install_command = "sh -c 'cd mingw-w64-headers; make DESTDIR=$DESTDIR install'"
