[package]
name = "binutils"
version = "2.46.0"
description = "The Binutils package contains a linker, an assembler, and other tools for handling object files"
source = "https://sourceware.org/pub/binutils/releases/binutils-2.46.0.tar.xz"
sha256 = "d75a94f4d73e7a4086f7513e67e439e8fcdcbb726ffe63f4661744e6256b2cf2"

[build]
system = "autotools"
multilib_support = false
configure_args = [
	"--sysconfdir=/etc",
	"--enable-ld=default",
	"--enable-plugins",
	"--enable-shared",
	"--disable-werror",
	"--enable-64-bit-bfd",
	"--enable-new-dtags",
	"--with-system-zlib",
	"--with-lib-path=/usr/lib", 
	"--enable-default-hash-style=gnu"
]
