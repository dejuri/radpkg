[package]
name = "gcc"
version = "15.2.0"
description = "The GCC package contains the GNU compiler collection, which includes the C and C++ compilers"
source = "https://ftpmirror.gnu.org/gcc/gcc-15.2.0/gcc-15.2.0.tar.xz"
sha256 = "438fd996826b0c82485a29da03a72d71d6e3541a83ec702df4271f6fe025d24e"

[build]
system = "manual"
build_commands = "wget https://raw.githubusercontent.com/dejuri/radpkg/main/stable-13/sys-devel/gcc.sh && bash -e ./gcc.sh build"
install_command = "bash -e ./gcc.sh install"
depends = "zlib"
