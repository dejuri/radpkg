[package]
name = "sdl3"
version = "3.4.4"
description = "The Simple DirectMedia Layer Version 3 (SDL3 for short) is a cross-platform library designed to make it easy to write multimedia software, such as games and emulators"
source = "https://www.libsdl.org/release/SDL3-3.4.4.tar.gz"
sha256 = "ee712dbe6a89bb140bbfc2ce72358fb5ee5cc2240abeabd54855012db30b3864"

[build]
system = "cmake"
configure_args = [
	"-D CMAKE_INSTALL_PREFIX=/usr",
	"-D CMAKE_BUILD_TYPE=Release",
	"-D SDL_TEST_LIBRARY=OFF",
	"-D SDL_STATIC=OFF",
	"-D SDL_RPATH=OFF",
	"-W no-dev",
	"-G Ninja"
]
