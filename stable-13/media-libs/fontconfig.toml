[package]
name = "fontconfig"
version = "2.18.3"
description = "The Fontconfig package contains a library and support programs used for managing font access"
source = "https://gitlab.freedesktop.org/api/v4/projects/890/packages/generic/fontconfig/2.18.3/fontconfig-2.18.3.tar.xz"
sha256 = "4f7b554a38cdf78c033f666c8871f3749e14a094f65a07f630c91ed0b43d35e3"

[build]
system = "autotools"
depends = "freetype"
configure_args = [
	"--prefix=/usr",
	"--sysconfdir=/etc",
	"--localstatedir=/var",
	"--disable-docs",
	"--docdir=/usr/share/doc/fontconfig-2.18.3"
]
