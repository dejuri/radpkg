[package]
name = "libplacebo"
version = "7.360.1"
description = "The libplacebo package contains a library for processing image and video primitives and shaders. It also includes a high quality rendering pipeline that supports OpenGL and Vulkan"
source = "https://github.com/haasn/libplacebo/archive/v7.360.1/libplacebo-7.360.1.tar.gz"
sha256 = "d05fdf90bea2f629eaa2d115e909fd356388ac639e54f77b87a018a6d76224bd"

[build]
system = "meson"
depends = "glad"
configure_args = [
	"--buildtype=release",
	"-D tests=true", 
	"-D demos=false"
]
