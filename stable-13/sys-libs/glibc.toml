[package]
name = "glibc"
version = "2.42"
description = "GNU C Library"
source = "https://ftp.gnu.org/gnu/glibc/glibc-2.42.tar.xz"
sha256 = "d1775e32e4628e64ef930f435b67bb63af7599acb6be2b335b9f19f16509f17f"
 
[build]
system = "manual"
multilib_support = true
build_commands = "wget https://raw.githubusercontent.com/dejuri/radpkg/main/stable-13/sys-libs/glibc.sh && bash -e ./glibc.sh build"
install_command = "bash -e ./glibc.sh install"
