[package]
name = "libblockdev"
version = "3.6.0"
description = "libblockdev is a C library supporting GObject Introspection for manipulation of block devices"
source = "https://github.com/storaged-project/libblockdev/releases/download/3.6.0/libblockdev-3.6.0.tar.gz"
sha256 = "9c21338257746cd00c25fcf5975716d016b6d43bfde20ee21f254cbf7d0d2742"

[build]
system = "autotools"
depends = "glib,cryptsetup,keyutils,libatasmart,libbytesize,libnvme,lvm2"
configure_args = [
	"--sysconfdir=/etc",
	"--with-python3",
	"--without-escrow",
	"--without-gtk-doc",
	"--without-lvm",
	"--without-lvm_dbus",
	"--without-nvdimm",
	"--without-tools",
	"--without-smartmontools",
]
