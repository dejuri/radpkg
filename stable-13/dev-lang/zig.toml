[package]
name = "zig"
version = "0.16.0"
description = "Zig is a general-purpose programming language and toolchain for maintaining"
source = "https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz"
sha256 = "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00"

[build]
system = "manual"
build_commands = "true"
install_command = [
	"mkdir $DESTDIR/usr/lib/zig $DESTDIR/usr/bin -p",
	"cp zig $DESTDIR/usr/bin/zig",
	"cp -r lib/* $DESTDIR/usr/lib/zig"
]
