[package]
name = "nettle"
version = "4.0"
description = "The Nettle package contains a low-level cryptographic library that is designed to fit easily in many contexts"
source = "https://ftpmirror.gnu.org/nettle/nettle-4.0.tar.gz"
sha256 = "3addbc00da01846b232fb3bc453538ea5468da43033f21bb345cb1e9073f5094"

[build]
system = "manual"
build_commands = [
	"./configure --prefix=$PREFIX --disable-static",
	"make -j$RAD_CORES"
]
install_commands = [
	"make DESTDIR=$DESTDIR install",
	"chmod -v 755 $DESTDIR$PREFIX/lib/libhogweed.so",
	"chmod -v 755 $DESTDIR$PREFIX/lib/libnettle.so",
	"install -v -m755 -d $DESTDIR/share/doc/nettle-{version}",
	"install -v -m644 nettle.html $DESTDIR/share/doc/nettle-{version}",
	"install -v -m644 nettle.pdf $DESTDIR/share/doc/nettle-{version}"
]
