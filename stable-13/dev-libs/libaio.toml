[package]
name = "libaio"
version = "0.3.113"
description = "The libaio package is an asynchronous I/O facility (``async I/O``, or ``aio``) that has a richer API and capability set than the simple POSIX async I/O facility. This library, libaio, provides the Linux-native API for async I/O"
source = "https://codeberg.org/jmoyer/libaio/releases/download/libaio-0.3.113/libaio-0.3.113.tar.gz"
sha256 = "2c44d1c5fd0d43752287c9ae1eb9c023f04ef848ea8d4aafa46e9aedb678200b"

[build]
system = "manual"
build_commands = [
	"sed -i '/install.*libaio.a/s/^/#/' src/Makefile",
	"make -j$RAD_CORES"
]
install_command = "make DESTDIR=$DESTDIR install"
