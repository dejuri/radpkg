[package]
name = "libffi"
version = "3.8.0"
description = "A portable foreign-function interface library"
source = "https://github.com/libffi/libffi/archive/refs/tags/v3.8.0.tar.gz"
sha256 = "bf40d752d8f5fd4505bcd1c7d4208ea87fd12c91f087e359651c776748352dc0"

[build]
system = "manual"
build_commands = [
	"./autogen.sh",
	"./configure --prefix=/usr",
	"make -j$RAD_CORES"
]
install_command = "make DESTDIR=$DESTDIR install"
depends = "make"
