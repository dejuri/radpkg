[package]
name = "simde"
version = "0.8.2"
description = "Header-only library for SIMD instruction sets"
source = "https://github.com/simd-everywhere/simde/archive/refs/tags/v0.8.2.tar.gz"
sha256 = "ed2a3268658f2f2a9b5367628a85ccd4cf9516460ed8604eed369653d49b25fb"

[build]
system = "manual"
build_commands = [
	"true"
]
install_command = "mkdir -p $DESTDIR/usr/include && cp -r simde $DESTDIR/usr/include/"
