[package]
name = "jemalloc"
version = "5.3.1"
description = "The jemalloc package provides a general-purpose, scalable, concurrent memory allocator. In addition to drop-in replacements for memory allocation functions defined in the standard C library (e.g., malloc), jemalloc provides several non-standard functions"
source = "https://github.com/jemalloc/jemalloc/releases/download/5.3.1/jemalloc-5.3.1.tar.bz2"
sha256 = "3826bc80232f22ed5c4662f3034f799ca316e819103bdc7bb99018a421706f92"

[build]
system = "manual"
build_commands = [
	"./autogen.sh",
	"./configure --prefix=$PREFIX",
	"make -j$RAD_CORES"
]
install_command = "make DESTDIR=$DESTDIR install"
