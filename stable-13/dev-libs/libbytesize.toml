[package]
name = "libbytesize"
version = "2.12"
description = "The libbytesize package is a library which facilitates the common operations with sizes in bytes"
source = "https://github.com/storaged-project/libbytesize/releases/download/2.12/libbytesize-2.12.tar.gz"
sha256 = "8356bac2cafd2f31f39bf1ad373cef8448cab08b817aeaee5c526d54e81c3c5a"

[build]
system = "manual"
depends = "glib,pcre2,gobject-introspection"
build_commands = [
	"./configure --prefix=$PREFIX --with-python3 --without-gtk-doc",
	"make -j$RAD_CORES"
]
install_command = "DESTDIR=$DESTDIR make install"
