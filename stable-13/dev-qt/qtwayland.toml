[package]
name = "qtwayland"
version = "6.12.0"
description = "Qt 6 Wayland platform plugin and module"
source = "https://mirrors.20i.com/pub/qt.io/official_releases/qt/6.12/6.12.0/submodules/qtwayland-everywhere-src-6.12.0.tar.xz"
sha256 = "ae14d9bcf1bb3c300a3ab2e6a53f50284e5c6c966a4ac4cc5aedcb1bc74e4d02"

[build]
system = "cmake"
depends = [
    "qtbase",
    "wayland",
    "wayland-protocols",
    "libxkbcommon"
]
configure_args = [
    "-GNinja",
    "-DCMAKE_INSTALL_PREFIX=/usr",
    "-DCMAKE_INSTALL_LIBDIR=lib",
    "-DINSTALL_PLUGINSDIR=lib/qt6/plugins",
    "-DCMAKE_BUILD_TYPE=Release",
    "-DQT_BUILD_EXAMPLES=OFF",
    "-DQT_BUILD_TESTS=OFF",
    "-DQT_FEATURE_wayland_client=ON",
    "-DQT_FEATURE_wayland_egl=ON",
    "-DQT_FEATURE_wayland_server=OFF"
]
post-install = "ldconfig"
