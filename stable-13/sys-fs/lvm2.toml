[package]
name = "lvm2"
version = "2.03.44"
description = "The LVM2 package is a set of tools that manage logical partitions"
source = "https://sourceware.org/ftp/lvm2/LVM2.2.03.44.tgz"
sha256 = "42f829927d2d459f5733fcdb38a5bf2455a8b84072193092450a9c69d6596eca"

[build]
system = "autotools"
depends = "libaio"
configure_args = [
	"--enable-cmdlib",
	"--enable-pkgconfig",
	"--enable-udev_sync"
]
