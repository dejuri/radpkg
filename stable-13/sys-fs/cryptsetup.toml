[package]
name = "cryptsetup"
version = "2.8.8"
description = "cryptsetup is used to set up transparent encryption of block devices using the kernel crypto API"
source = "https://www.kernel.org/pub/linux/utils/cryptsetup/v2.8/cryptsetup-2.8.8.tar.xz"
sha256 = "3acfa685f2dd7fcc832e0b77bc7093aa7da554a51ce8dafbb4138eaa854eee35"

[build]
system = "autotools"
depends = "json-c,lvm2,popt"
configure_args = [
	"--disable-ssh-token",
	"--disable-asciidoc"
]
