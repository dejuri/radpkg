[package]
name = "fish"
version = "4.7.1"
description = "fish is a smart and user-friendly command line shell for macOS, Linux, and the rest of the family"
source = "https://github.com/fish-shell/fish-shell/releases/download/4.7.1/fish-4.7.1.tar.xz"
sha256 = "6f4d5b438a6338e3f5dcda19a28261e2ece7a9b7ff97686685e6abdc31dbb7df"

[build]
system = "manual"
build_commands = "cargo build --release --jobs $RAD_CORES"
install_command = "mkdir $DESTDIR/bin -p && cp ./target/release/fish $DESTDIR/bin/fish"
dependencies = "coreutils"
