[package]
name = "cpptrace"
version = "1.0.4"
description = "Simple, portable, and self-contained stacktrace library for C++11 and newer"
source = "https://github.com/jeremy-rifkin/cpptrace/archive/refs/tags/v1.0.4.tar.gz"
sha256 = "5c9f5b301e903714a4d01f1057b9543fa540f7bfcc5e3f8bd1748e652e24f9ea"

[build]
system = "cmake"
depends = "libunwind"
configure_args = ["-DCPPTRACE_UNWIND_WITH_LIBUNWIND=ON"]
