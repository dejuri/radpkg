[package]
name = "xz-utils"
version = "5.8.4"
description = "The Xz-utils package contains programs for compressing and decompressing files. It provides capabilities for the lzma and the newer xz compression formats. Compressing text files with xz yields a better compression percentage than with the traditional gzip or bzip2 commands"
source = "https://github.com//tukaani-project/xz/releases/download/v5.8.4/xz-5.8.4.tar.xz"
sha256 = "4ce24038fd4221e0d13bc1a2de7a4db56e90b92b3bf75321f6c14be73f65de4b"

[build]
system = "manual"
depends = "make"
build_commands = [
	"./configure --prefix=$PREFIX --disable-static --docdir=$PREFIX/share/doc/xz-{version}",
	"make -j$RAD_CORES"
]
install_command = "make DESTDIR=$DESTDIR install"
