[package]
name = "doas"
version = "6.8.2"
description = "A portable fork of the OpenBSD ``doas`` command"
source = "https://github.com/Duncaen/OpenDoas/releases/download/v6.8.2/opendoas-6.8.2.tar.gz"
sha256 = "28dca29adec5f4336465812d9e2243f599e62a78903de71c24f0cd6fe667edac"

[build]
system = "manual"
build_commands = [
	"./configure --prefix=$PREFIX --with-timestamp",
	"make -j$RAD_CORES"
]
install_command = "make DESTDIR=$DESTDIR install"
