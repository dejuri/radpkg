[package]
name = "nvidia-drivers"
version = "610.57.04"
description = "nVidia proprietary drivers package"
unfree = true

[build]
system = "manual"
build_commands = [
	"wget https://us.download.nvidia.com/XFree86/Linux-x86_64/{version}/NVIDIA-Linux-x86_64-{version}.run",
	"chmod +x NVIDIA-Linux-x86_64-{version}.run",
	"./NVIDIA-Linux-x86_64-{version}.run --extract-only",
	"make -C NVIDIA-Linux-x86_64-{version}/kernel-open modules -j$RAD_CORES"
]
install_command = [ "make -C NVIDIA-Linux-x86_64-{version}/kernel-open modules_install SYSSRC=$PREFIX/src/linux-{sys-kernel/linux.version} INSTALL_MOD_PATH=$DESTDIR$PREFIX",
    "mkdir -p $DESTDIR$PREFIX/lib $DESTDIR$PREFIX/lib32 $DESTDIR$PREFIX/bin $DESTDIR$PREFIX/share/glvnd/egl_vendor.d $DESTDIR/etc/vulkan/icd.d $DESTDIR/etc/vulkan/implicit_layer.d $DESTDIR$PREFIX/lib/gbm $DESTDIR$PREFIX/lib32/gbm $DESTDIR$PREFIX/share/nvidia $DESTDIR$PREFIX/share/man/man1 $DESTDIR/$PREFIX/share/applications $DESTDIR$PREFIX/share/pixmaps $DESTDIR$PREFIX/lib/firmware/nvidia/{version} $DESTDIR$PREFIX/share/egl/egl_external_platform.d $DESTDIR$PREFIX/lib/nvidia/wine $DESTDIR$PREFIX/lib/nvidia/32",
    "find NVIDIA-Linux-x86_64-{version}/ -maxdepth 1 -name '*.so*' ! -name 'libGL.*' ! -name 'libEGL.*' ! -name 'libGLX.*' ! -name 'libGLESv*.*' ! -name 'libOpenGL.*' ! -name 'libGLdispatch.*' ! -name 'libglxserver*' -exec cp -a {} $DESTDIR$PREFIX/lib/ \\;",
    "find NVIDIA-Linux-x86_64-{version}/32/ -maxdepth 1 -name '*.so*' ! -name 'libGL.*' ! -name 'libEGL.*' ! -name 'libGLX.*' ! -name 'libGLESv*.*' ! -name 'libOpenGL.*' ! -name 'libGLdispatch.*' ! -name 'libglxserver*' -exec cp -a {} $DESTDIR$PREFIX/lib32/ \\;",
    "cp -a NVIDIA-Linux-x86_64-{version}/nvidia_icd.json $DESTDIR/etc/vulkan/icd.d/",
    "cp -a NVIDIA-Linux-x86_64-{version}/10_nvidia_wayland.json $DESTDIR$PREFIX/share/glvnd/egl_vendor.d/",
    "cp -a NVIDIA-Linux-x86_64-{version}/10_nvidia.json $DESTDIR$PREFIX/share/glvnd/egl_vendor.d/",
    "cp -a NVIDIA-Linux-x86_64-{version}/nvidia-application-profiles-* $DESTDIR$PREFIX/share/nvidia/",
    "cp -a NVIDIA-Linux-x86_64-{version}/*.conf $DESTDIR$PREFIX/share/nvidia/",
    "cp -a NVIDIA-Linux-x86_64-{version}/*.dll $DESTDIR$PREFIX/lib/nvidia/wine/",
    "cp -a NVIDIA-Linux-x86_64-{version}/libglvnd_install_checker/*_* $DESTDIR$PREFIX/lib/nvidia/",
    "cp -a NVIDIA-Linux-x86_64-{version}/32/libglvnd_install_checker/* $DESTDIR$PREFIX/lib/nvidia/32/",
    "for bin in nvidia-smi nvidia-settings nvidia-xconfig nvidia-cuda-mps-control nvidia-cuda-mps-server nvidia-debugdump nvidia-modprobe nvidia-persistenced nvidia-powerd nvidia-ngx-updater nvidia-pcc; do [ -f NVIDIA-Linux-x86_64-{version}/$bin ] && cp -a NVIDIA-Linux-x86_64-{version}/$bin $DESTDIR$PREFIX/bin/; done",
    "find NVIDIA-Linux-x86_64-{version}/ -maxdepth 1 -name 'libnvidia-allocator.so*' -exec cp -a {} $DESTDIR$PREFIX/lib/ \\;",
"ln -sf ../libnvidia-allocator.so.{version} $DESTDIR$PREFIX/lib/gbm/nvidia-drm_gbm.so",
"find NVIDIA-Linux-x86_64-{version}/ -maxdepth 1 -name 'libnvidia-egl-gbm.so*' -exec cp -a {} $DESTDIR$PREFIX/lib/ \\;",
"cp -a NVIDIA-Linux-x86_64-{version}/15_nvidia_gbm.json $DESTDIR$PREFIX/share/egl/egl_external_platform.d/",
"cp -a NVIDIA-Linux-x86_64-{version}/nvidia_layers.json $DESTDIR/etc/vulkan/implicit_layer.d/",
    "cp -a NVIDIA-Linux-x86_64-{version}/*.1.gz $DESTDIR$PREFIX/share/man/man1/",
    "cp -a NVIDIA-Linux-x86_64-{version}/nvidia-settings.desktop $DESTDIR$PREFIX/share/applications/",
    "cp -a NVIDIA-Linux-x86_64-{version}/nvidia-settings.png $DESTDIR$PREFIX/share/pixmaps/"
]
post_install = [ "depmod -a {sys-kernel/linux.version}", "ldconfig" ]
depends = "linux,vulkan-headers,vulkan-loader,spirv-headers,spirv-tools,glslang,libglvnd,nvidia-firmware"
