[package]
name = "ddcutil"
version = "3.0.1"
description = "Utility for controlling monitor settings"
source = "https://github.com/rockowitz/ddcutil/archive/refs/tags/v3.0.1.tar.gz"
sha256 = "561e26f8ebcdb07e182092b9a0d27477842879b1a5338b52505ad49780cc824b"

[build]
system = "manual"
build_commands = [
	"./autogen.sh",
	"./configure --prefix=/usr --sysconfdir=/etc",
	"make -j$RAD_CORES"
]
install_command = "make DESTDIR=$DESTDIR install"
depends = "jansson"
