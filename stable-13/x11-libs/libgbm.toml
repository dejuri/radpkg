[package]
name = "libgbm"
version = "1.0.8"
description = "This provides API functions for managing memory buffers"
source = "https://github.com/glfs-book/libgbm/archive/1.0.8/libgbm-1.0.8.tar.gz"
sha256 = "235ac65dc0dd8e4345c824e48f42fb81576b7a9521ecc01d0c40f038027dc68a"

[build]
system = "manual"
build_commands = [
	"rm -rf build || true",
	"mkdir build",
	"sh -c 'if [ \"$IS_M32\" = \"1\" ]; then (meson setup --prefix=/usr --buildtype=release --cross-file=lib32 --libdir=/usr/lib32 build); else (meson setup --prefix=/usr --buildtype=release build); fi'",
	"ninja -C build -j$RAD_CORES"
]
install_command = "ninja install -C build"
multilib_support = true
