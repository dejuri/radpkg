[package]
name = "libsecret"
version = "0.21.8.2"
description = "The libsecret package contains a GObject based library for accessing the Secret Service API"
source = "https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.8.2.tar.xz"
sha256 = "142948339c5b971d8f6a8c7099521f6fd319b6fe73d2694b4e6d3310ed28b6e6"

[build]
system = "manual"
depends = "glib,libgcrypt,vala,gnome-keyring"
build_commands = [
	"sed -i \"/subdir('docs')/d\" meson.build",
	"meson setup build --prefix=$PREFIX -Dgtk_doc=false",
	"ninja -C build -j$RAD_CORES"
]
install_command = "DESTDIR=$DESTDIR ninja -C build install"
