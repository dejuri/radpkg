[package]
name = "gnupg"
version = "2.5.18"
description = "The GnuPG package is GNU's tool for secure communication and data storage"
source = "https://www.gnupg.org/ftp/gcrypt/gnupg/gnupg-2.5.18.tar.bz2"
sha256 = "0dbd64e0322fe1a4813360d46539d5f8daf4a8fa235cf5fce464e8b0214a7e4f"

[build]
system = "autotools"
configure_args = [
	"--localstatedir=/var",
	"--sysconfdir=/etc", 
	"--docdir=/usr/share/doc/gnupg-2.5.18"
]
depends = "libassuan,libksba,npth,openldap"
