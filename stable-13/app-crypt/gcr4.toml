[package]
name = "gcr4"
version = "4.4.1"
description = "The Gcr package contains libraries used for displaying certificates and accessing key stores"
source = "https://download.gnome.org/sources/gcr/4.4/gcr-4.4.1.tar.xz"
sha256 = "c4442c15d4330f17a1f5194df08c576877af68412ab2521446a93bd5e24c931b"

[build]
system = "manual"
depends = "glib,libgcrypt,p11-kit,gnupg,gtk4,libsecret,libxslt,vala"
build_commands = [
	"meson setup build --prefix=$PREFIX -Dgtk_doc=false -Dssh_agent=false",
	"ninja -C build -j$RAD_CORES"
]
install_command = "DESTDIR=$DESTDIR ninja -C build install"
